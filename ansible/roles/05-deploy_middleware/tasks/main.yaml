#  tags: install

#- name: 卸载Redis
#  shell: helm uninstall redis --namespace {{ NAME_SPACE }}
#  become: no
#  tags: uninstall

- name: 安装minio
  shell: helm upgrade --install minio {{ DEST_PATH }}/helm_all/minio-11.10.25.tgz -n {{ NAME_SPACE }} --create-namespace --set auth.rootUser={{ MINIO_USER }} --set auth.rootPassword={{ MINIO_PASSWORD }} --set image.registry={{ HARBOR_URL }} --set image.repository={{ HARBOR_PRONAME }}/minio --set image.tag=2022.12.12-debian-11-r9
  become: no
  tags: install

- name: 卸载minio
  shell: helm uninstall minio --namespace {{ NAME_SPACE }}
  become: no
  tags: uninstall

- name: 生成loki-values文件
  template: src=values-loki.yaml.j2 dest={{ DEST_PATH }}/helm_all/values-loki.yaml force=yes
  ignore_errors: yes
  tags: install

- name: 安装loki
  shell: helm install loki {{ DEST_PATH }}/helm_all/loki-stack-2.9.10.tgz -f {{ DEST_PATH }}/helm_all/values-loki.yaml --namespace loki --create-namespace
  become: no
  ignore_errors: yes
  tags: install