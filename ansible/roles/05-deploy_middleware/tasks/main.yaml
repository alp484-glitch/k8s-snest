---
- name: 检查主机是否存在helm进程-1
  shell: which helm
  ignore_errors: yes
  register: check_helm
  tags: install

- name: 检查后端是否运行结果输出
  debug: msg="{{ check_helm }}"
  tags: install

- name: 检查主机是否存在helm进程-2
  debug: msg="没有在主机上发现可用的helm进程"
  when: check_helm.rc != 0
  tags: install

- name: 拷贝所有需要的文件(耗时略长~)
  synchronize: src=helm_all.tar.gz dest={{ DEST_PATH }}/
  become: no
  tags: install

- name: 解压文件
  shell: rm -rf {{ DEST_PATH }}/helm_all && tar -zxf {{ DEST_PATH }}/helm_all.tar.gz -C {{ DEST_PATH }}/
  tags: install

- name: 解压helm安装包
  shell: tar -zxf {{ DEST_PATH }}/helm_all/helm-v3.11.0-linux-amd64.tar.gz -C {{ DEST_PATH }}/helm_all/
  when: check_helm.rc != 0
  tags: install

- name: 安装helm
  shell: chmod +x {{ DEST_PATH }}/helm_all/linux-amd64/helm && cp {{ DEST_PATH }}/helm_all/linux-amd64/helm /usr/local/bin
  when: check_helm.rc != 0
  tags: install

- name: 安装Dapr
  shell: helm install dapr {{ DEST_PATH }}/helm_all/dapr-1.9.5.tgz --version=1.9.5 --namespace dapr-system --create-namespace --set global.ha.enabled=false --set global.mtls.enabled=false --set global.registry={{ HARBOR_URL }}/{{ HARBOR_PRONAME }}
  ignore_errors: yes
  become: no
  tags: install

#- name: 安装Redis
